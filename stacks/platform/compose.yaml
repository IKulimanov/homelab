# Служебные программы homelab: ops-bot (алерты и команды в Telegram), llm-gateway (учёт и лимиты LLM), dozzle (логи).
# Образы ops-bot и llm-gateway собираются из этого же репозитория (.github/workflows/build.yml). Общие переменные — /opt/homelab/.env.
name: platform

x-svc: &svc
  restart: unless-stopped
  # Шлюз ждёт начатые запросы к модели до 60 с, ops-bot — остановку контейнера по команде.
  stop_grace_period: 90s
  logging:
    driver: local
    options: { max-size: 10m, max-file: "3" }
  networks: [homelab]

services:
  llm-gateway:
    <<: *svc
    image: ghcr.io/ikulimanov/llm-gateway:${LLM_GATEWAY_TAG:-main}
    container_name: llm-gateway
    # GEMINI_API_KEY и ключи ботов LLM_KEY_<ИМЯ>.
    env_file: /srv/llm-gateway/.env
    environment:
      TZ: ${TZ:-Asia/Bishkek}
      LLM_ADMIN_TOKEN: ${LLM_ADMIN_TOKEN:-}
      LLM_CONFIG: /config/llm-gateway.yaml
      LLM_DB: /data/llm-gateway.db
    volumes:
      - /srv/llm-gateway/data:/data
      # Каталог, а не файл: git pull заменяет файл новым, и привязка к одному файлу осталась бы на старом.
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ops-bot:
    <<: *svc
    image: ghcr.io/ikulimanov/ops-bot:${OPS_BOT_TAG:-main}
    container_name: ops-bot
    # Группа docker хоста: без неё пользователь nonroot не откроет сокет. Значение пишет install.sh.
    group_add: ["${DOCKER_GID}"]
    # Ключ шлюза для комментария к недельному отчёту: GEMINI_API_KEY, GEMINI_BASE_URL (install.sh llm-key ops-bot).
    env_file: /srv/ops-bot/.env
    environment:
      TZ: ${TZ:-Asia/Bishkek}
      OPS_BOT_TOKEN: ${OPS_BOT_TOKEN}
      OPS_CHAT_ID: ${OPS_CHAT_ID}
      LLM_ADMIN_TOKEN: ${LLM_ADMIN_TOKEN:-}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      OPS_DISKS: ${OPS_DISKS:-/,/data,/mnt/backup}
      # --env-file только подставляет значения в этот файл, в контейнер попадает лишь то, что перечислено здесь.
      # Пустое значение — порог по умолчанию.
      OPS_CPU_TEMP: ${OPS_CPU_TEMP:-}
      OPS_SSD_TEMP: ${OPS_SSD_TEMP:-}
      OPS_MEM: ${OPS_MEM:-}
      OPS_SWAP: ${OPS_SWAP:-}
      OPS_DISK: ${OPS_DISK:-}
      OPS_LOAD: ${OPS_LOAD:-}
      OPS_BATTERY: ${OPS_BATTERY:-}
      OPS_ALERTS: ${OPS_ALERTS:-temp,disk,service,llm}
      OPS_REPORT_AT: ${OPS_REPORT_AT:-Sun 20:00}
      OPS_VOICE: /voice
      OPS_HOSTFS: /hostfs
      OPS_TRIGGER: /trigger/update
      OPS_DB: /data/ops.db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/ops-bot/data:/data
      # Фразы Бендера. Каталог, а не файлы: после git pull бот видит новые версии без пересоздания.
      - ./config/voice:/voice:ro
      # Файл-триггер команды /update; его ждёт homelab-update.path на хосте.
      - /srv/ops-bot/trigger:/trigger
      # Корень хоста только для чтения: по нему считается место на дисках. rslave — чтобы был виден
      # и /mnt/backup, если сетевой том смонтируется после старта контейнера.
      - type: bind
        source: /
        target: /hostfs
        read_only: true
        bind:
          propagation: rslave

  # Логи всех контейнеров в браузере: http://<LAN_IP>:8889. Входа нет, поэтому порт только в домашней сети.
  dozzle:
    <<: *svc
    image: amir20/dozzle:v10
    container_name: dozzle
    stop_grace_period: 10s
    environment:
      # Только контейнеры из compose-проектов: platform, apps, media-stack.
      DOZZLE_FILTER: label=com.docker.compose.project
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Опубликованный порт Docker обходит ufw и слушает IPv6, поэтому привязка к адресу в домашней сети.
    # Без LAN_IP — только localhost, открывать через ssh -L 8889:localhost:8889.
    ports:
      - ${LAN_IP:-127.0.0.1}:8889:8080
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  homelab:
    external: true
